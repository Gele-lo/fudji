<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dynamic Responsive Gallery</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#7c5cff;
      --glass:rgba(255,255,255,0.04);
      --radius:14px;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#071028 0%, #0f1724 100%);
      color:#e6eef8;
      padding:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .gallery-wrap{
      width:1200px;
      max-width:calc(100% - 48px);
      padding:24px;
    }

    .thumbs{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
      gap:12px;
    }
    .thumb{
      position:relative;
      overflow:hidden;
      border-radius:12px;
      cursor:pointer;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .3s ease, filter .3s ease;
    }
    .thumb:hover img{
      transform:scale(1.08);
      filter:blur(2px) brightness(0.8);
    }

    @media(max-width:700px){
      .thumbs{grid-template-columns:repeat(auto-fit, minmax(120px,1fr));}
    }
  </style>
</head>
